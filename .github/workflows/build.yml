name: Build InfuseBypass

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for tvOS
        run: |
          xcodebuild \
            -project InfuseBypass.xcodeproj \
            -scheme InfuseBypass \
            -configuration Release \
            -sdk appletvos \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | xcpretty || true

      - name: Find framework
        run: find ~/Library/Developer/Xcode/DerivedData -name "InfuseBypass.framework" -type d 2>/dev/null || find . -name "InfuseBypass.framework" -type d

      - name: Copy framework
        run: |
          FRAMEWORK=$(find ~/Library/Developer/Xcode/DerivedData -name "InfuseBypass.framework" -type d | head -1)
          cp -r "$FRAMEWORK" ./InfuseBypass.framework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfuseBypass.framework
          path: InfuseBypass.framework/
